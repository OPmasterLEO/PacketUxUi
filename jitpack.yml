# Avoid `jdk: openjdk21` — JitPack points JAVA_HOME at missing 21.0.2-open.
# Temurin 21 via SDKMAN; Foojay auto-downloads JDK 25 for v26_* paperweight.
before_install:
  - sdk update || true
  - |
    set +e
    for v in 21.0.6-tem 21.0.5-tem 21.0.4-tem 21.0.3-tem 21-tem; do
      echo "Trying SDKMAN java $v"
      yes | sdk install java "$v"
      if [ -d "${SDKMAN_DIR:-$HOME/.sdkman}/candidates/java/$v" ]; then
        echo "$v" > /tmp/jitpack-java-version
        break
      fi
    done
    set -e
    test -f /tmp/jitpack-java-version

install:
  - export JAVA_HOME="${SDKMAN_DIR:-$HOME/.sdkman}/candidates/java/$(cat /tmp/jitpack-java-version)"
  - export PATH="$JAVA_HOME/bin:$PATH"
  - echo "JAVA_HOME=$JAVA_HOME"
  - java -version
  - ./gradlew clean publishToMavenLocal -x test --no-daemon
