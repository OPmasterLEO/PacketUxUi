name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to create/publish (e.g. v1.0.1). Leave empty to use project version."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    name: Publish Release
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup JDK 21 and 25
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: |
            21
            25
          cache: "gradle"

      - name: Resolve version / tag
        id: meta
        run: |
          PROJECT_VERSION="$(./gradlew -q printVersion)"
          TAG_INPUT="${{ github.event.inputs.tag }}"
          if [ -n "$TAG_INPUT" ]; then
            TAG="$TAG_INPUT"
          else
            TAG="v${PROJECT_VERSION}"
          fi
          echo "version=${PROJECT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved tag=${TAG} version=${PROJECT_VERSION}"

      - name: Build publishable artifacts
        run: chmod +x gradlew && ./gradlew clean shadowJar -x test --no-daemon

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          files: |
            build/libs/PacketUxUi-*.jar

      - name: Warm JitPack for release tag
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          URL="https://jitpack.io/com/github/${{ github.repository }}/${TAG}/build.log"
          echo "Requesting ${URL}"
          curl -fsSL --max-time 900 -L "${URL}" -o jitpack-build.log
          tail -n 80 jitpack-build.log
          if grep -qiE 'Build failed|FAILURE: Build failed' jitpack-build.log; then
            echo "JitPack reported a failed build"
            exit 1
          fi
