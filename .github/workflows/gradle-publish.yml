name: Gradle Package

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"

      - name: Build with Gradle (JitPack install path)
        run: chmod +x gradlew && ./gradlew clean :packetuxui:publishToMavenLocal -x test --no-daemon

      - name: Upload packetuxui jar
        uses: actions/upload-artifact@v7
        with:
          name: packetuxui-build
          path: packetuxui/build/libs/packetuxui-*.jar
          if-no-files-found: error

  jitpack:
    name: Trigger JitPack
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Warm JitPack build for this commit
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          REF="${{ github.sha }}"
          URL="https://jitpack.io/com/github/${REPO}/${REF}/build.log"
          echo "Requesting ${URL}"
          # Give GitHub a moment to make the commit visible to JitPack.
          sleep 15
          attempt=1
          while [ "$attempt" -le 3 ]; do
            echo "JitPack attempt ${attempt}/3"
            if curl -fsSL --max-time 900 -L "${URL}" -o jitpack-build.log; then
              break
            fi
            attempt=$((attempt + 1))
            sleep 30
          done
          if [ ! -s jitpack-build.log ]; then
            echo "JitPack did not return a build log"
            exit 1
          fi
          echo "---- JitPack log (tail) ----"
          tail -n 80 jitpack-build.log
          if grep -qiE 'Build failed|FAILURE: Build failed' jitpack-build.log; then
            echo "JitPack reported a failed build"
            exit 1
          fi
